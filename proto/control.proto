// PipelineControl — control-plane RPC for the Session Control Bus.
//
// Clients open a long-lived bidirectional stream to observe, inject, and
// edit data flowing through any node of a running pipeline session.
//
// See `docs/SESSION_CONTROL.md` for the semantic model. This file is the
// wire encoding of the logical `ControlFrame` / `ControlEvent` enums
// defined in `crates/core/src/transport/session_control.rs`.
//
// Design choices:
//
//   - Single bidi RPC (`Attach`). One RPC multiplexes tap / publish /
//     intercept / node-state operations within a session. Matches the
//     shape of `SessionControl::handle_frame` on the server.
//
//   - The **first** `ControlFrame` on an `Attach` stream MUST be a
//     `Hello { session_id }`. The server looks the session up in the
//     `SessionControlBus`; if missing, it closes the stream with
//     `ControlEvent::Error { code = SESSION_NOT_FOUND }` and returns.
//
//   - All subsequent frames operate within the attached session. The
//     server scopes every operation to the session the client named.
//
//   - When the session closes (normal or error), the server emits one
//     final `ControlEvent::SessionClosed` and ends the response stream.
//
//   - RuntimeData payloads reuse `remotemedia.v1.DataBuffer` from
//     `common.proto` so Tap/Publish/Intercept payloads speak the same
//     wire type as the data plane.

syntax = "proto3";

package remotemedia.v1;

import "common.proto";

// ============================================================================
// Service
// ============================================================================

service PipelineControl {
  // Open a control-plane attach to an existing session. The first frame
  // the client sends MUST be a `Hello`. The server streams `ControlEvent`s
  // back until the session terminates or the client closes the stream.
  rpc Attach(stream ControlFrame) returns (stream ControlEvent);

  // ── Discovery (openspec: add-live-pipeline-observer) ─────────────────
  // List every session registered on this process's control bus.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Running topology of one session (nodes, ports, edges). NOT_FOUND for
  // unknown ids.
  rpc DescribeSession(DescribeSessionRequest) returns (DescribeSessionResponse);
  // Initial session list followed by created / updated / closed events.
  rpc WatchSessions(WatchSessionsRequest) returns (stream SessionLifecycle);
}

// ============================================================================
// Address model
// ============================================================================

// Which side of a node the client is talking to.
enum ControlDirection {
  CONTROL_DIRECTION_UNSPECIFIED = 0;
  CONTROL_DIRECTION_IN          = 1;  // publish / inject (client -> node input)
  CONTROL_DIRECTION_OUT         = 2;  // subscribe / intercept (node output -> client)
}

// A point within the session's pipeline. Mirrors `ControlAddress` in Rust.
message ControlAddress {
  string node_id = 1;
  // Optional named port. Empty string = the node's `main` rail.
  string port = 2;
  ControlDirection direction = 3;
}

// ============================================================================
// Node-state operations
// ============================================================================

// Runtime execution state for a single node. Mirrors Rust `NodeState`.
enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  NODE_STATE_ENABLED     = 1;
  NODE_STATE_BYPASS      = 2;
  NODE_STATE_DISABLED    = 3;
}

// ============================================================================
// Intercept support
// ============================================================================

// Decision the client returns for an `InterceptRequest`.
message InterceptDecision {
  oneof decision {
    // Forward the frame unchanged.
    Empty   pass     = 1;
    // Replace the frame with this data before forwarding.
    DataBuffer replace = 2;
    // Drop the frame entirely (downstream nodes don't see it).
    Empty   drop     = 3;
  }
}

// Empty placeholder (protobuf oneof can't have bare tag variants).
message Empty {}

// ============================================================================
// Client -> Server frames
// ============================================================================

message ControlFrame {
  oneof op {
    Hello            hello            = 1;
    Subscribe        subscribe        = 2;
    Unsubscribe      unsubscribe      = 3;
    Publish          publish          = 4;
    Intercept        intercept        = 5;
    RemoveIntercept  remove_intercept = 6;
    InterceptReply   intercept_reply  = 7;
    SetNodeState     set_node_state   = 8;
    ClearNodeState   clear_node_state = 9;
    // Change this session's telemetry level / snapshot interval.
    SetTelemetry     set_telemetry    = 10;

    // ── Client-hosted endpoints (openspec: add-agent-harness-integration) ──
    // Register an endpoint hosted by this attach. Answered by
    // `EndpointHosted`. The registration ends when the attach closes.
    HostEndpoint     host_endpoint    = 11;
    // Stop hosting an endpoint registered by this attach.
    UnhostEndpoint   unhost_endpoint  = 12;
    // Reply chunk for an `EndpointCall`. Answered by `EndpointReplyAck`.
    EndpointReply    endpoint_reply   = 13;
    // Stream endpoint presence changes (`EndpointPresenceEvent`), starting
    // with one `hosted = true` event per currently hosted endpoint.
    WatchEndpoints   watch_endpoints  = 14;
  }
}

// Identifies the session this attach is scoped to. MUST be the first frame.
message Hello {
  string session_id = 1;
  // Optional: client-chosen identifier, echoed in every event for
  // multi-attach scenarios where the same client attaches more than once.
  string attach_id = 2;
  // Optional: who this attach speaks for (openspec:
  // add-multi-participant-sessions). Frames it publishes are stamped with
  // these `participant.*` fields unless the frame's own metadata sets them.
  ParticipantInfo participant = 3;
}

message Subscribe       { ControlAddress addr = 1; }
message Unsubscribe     { ControlAddress addr = 1; }
message Publish         { ControlAddress addr = 1; DataBuffer data = 2; }
message RemoveIntercept { ControlAddress addr = 1; }

message Intercept {
  ControlAddress addr = 1;
  // Maximum time the router will wait for an `InterceptReply` before
  // forwarding the original frame unchanged. 0 = server default (50 ms).
  uint32 deadline_ms = 2;
}

message InterceptReply {
  // Matches the `correlation_id` on the inbound `InterceptRequest` event.
  uint64 correlation_id = 1;
  InterceptDecision decision = 2;
}

message SetNodeState {
  string node_id = 1;
  NodeState state = 2;
}

message ClearNodeState { string node_id = 1; }

// Telemetry level for the attached session: "off" | "counters" | "auto" |
// "full". Empty = unchanged. `interval_ms` 0 = unchanged (else clamped to
// 250–5000).
message SetTelemetry {
  string level = 1;
  uint32 interval_ms = 2;
}

// One method an endpoint serves. `mode`: "reply" | "stream" | "ff".
message EndpointMethod {
  string name = 1;
  string mode = 2;
}

// Endpoint hosting is a control operation: when the server is configured
// with a bearer token the attach must carry it, and servers may disable
// hosting entirely (observe-only), in which case the result is `forbidden`.
message HostEndpoint {
  // Endpoint id; must not equal a node id or a reserved virtual node.
  string name = 1;
  // Empty = accept any method (mode taken from the request).
  repeated EndpointMethod methods = 2;
  // "agent" | "service" (default "service").
  string host_kind = 3;
  // Informational adapter name (agent hosts).
  string adapter = 4;
  // Calls in flight at this host before new calls fail with `overloaded`.
  // 0 = server default (64).
  uint32 queue_capacity = 5;
  // Replace an existing host (its pending calls fail with `responder_gone`).
  bool takeover = 6;
}

message UnhostEndpoint { string name = 1; }

message EndpointReply {
  string name = 1;
  // `call_id` from the `EndpointCall` event.
  string call_id = 2;
  // "value" | "end" | "error".
  string kind = 3;
  // JSON value for kind = "value".
  string data_json = 4;
  // Error kind for kind = "error" ("unavailable", "error", ...).
  string error = 5;
  string message = 6;
  // Optional JSON metadata (adapter, route, escalated).
  string meta_json = 7;
}

message WatchEndpoints {}

// ============================================================================
// Server -> Client events
// ============================================================================

message ControlEvent {
  oneof event {
    // Attach was accepted. Sent exactly once, in response to Hello.
    Attached         attached          = 1;
    // A tapped node output. `addr.direction` = OUT.
    TapEvent         tap               = 2;
    // An intercept needs a decision. Client must send
    // `InterceptReply { correlation_id }` within the deadline.
    InterceptRequest intercept_request = 3;
    // A non-fatal error (bad address, unknown node, etc.) surfaced to
    // the client without closing the stream.
    ErrorEvent       error             = 4;
    // Sent exactly once as the final frame when the session closes.
    SessionClosed    session_closed    = 5;

    // ── Client-hosted endpoints (openspec: add-agent-harness-integration) ──
    // Result of a `HostEndpoint` frame.
    EndpointHosted        endpoint_hosted    = 6;
    // A call for an endpoint this attach hosts (delivered only to the host).
    EndpointCall          endpoint_call      = 7;
    // A delivered call was cancelled (deadline | caller | session_closed).
    EndpointCancelled     endpoint_cancelled = 8;
    // Presence change. Also sent to a host whose registration ended
    // (`reason`: "taken_over" | "session_closed" | "unhosted").
    EndpointPresenceEvent endpoint_presence  = 9;
    // Result of an `EndpointReply` frame.
    EndpointReplyAck      endpoint_reply_ack = 10;
  }
}

message EndpointHosted {
  string name = 1;
  bool ok = 2;
  // On failure: "already_hosted" | "name_conflict" | "forbidden" |
  // "session_closed" | "invalid".
  string error = 3;
  string message = 4;
}

message EndpointCall {
  string name = 1;
  // Host-unique id ("<caller_node>/<corr_id>"); echo it in `EndpointReply`.
  string call_id = 2;
  string caller_node = 3;
  string session_id = 4;
  string method = 5;
  // "reply" | "stream" | "ff".
  string mode = 6;
  // JSON array.
  string args_json = 7;
  // JSON object.
  string kwargs_json = 8;
  // Deadline remaining at delivery.
  uint64 deadline_ms = 9;
  string route_hint = 10;
  string adapter_hint = 11;
}

message EndpointCancelled {
  string name = 1;
  string call_id = 2;
  // "deadline" | "caller" | "session_closed".
  string reason = 3;
}

message EndpointPresenceEvent {
  string name = 1;
  bool hosted = 2;
  string reason = 3;
}

message EndpointReplyAck {
  string name = 1;
  string call_id = 2;
  bool accepted = 3;
  // When not accepted: "late" | "cancelled" | "unknown_call" |
  // "responder_gone" | "invalid".
  string reason = 4;
}

message Attached {
  string session_id = 1;
  string attach_id = 2;
  // Telemetry / descriptor schema version the server speaks (0 = server
  // predates live-pipeline-observer).
  uint32 observer_schema_version = 3;
}

message TapEvent {
  ControlAddress addr = 1;
  DataBuffer data = 2;
}

message InterceptRequest {
  ControlAddress addr = 1;
  uint64 correlation_id = 2;
  DataBuffer data = 3;
}

// Structured error codes. Granular for client-side pattern-matching.
enum ControlErrorCode {
  CONTROL_ERROR_CODE_UNSPECIFIED       = 0;
  CONTROL_ERROR_CODE_SESSION_NOT_FOUND = 1;
  CONTROL_ERROR_CODE_UNKNOWN_NODE      = 2;
  CONTROL_ERROR_CODE_INVALID_ADDRESS   = 3;
  CONTROL_ERROR_CODE_PROTOCOL          = 4;  // first frame wasn't Hello, etc.
  CONTROL_ERROR_CODE_UNAUTHORIZED      = 5;
  CONTROL_ERROR_CODE_INTERNAL          = 6;
}

message ErrorEvent {
  ControlErrorCode code = 1;
  string message = 2;
  // Optional address context if the error relates to a specific operation.
  ControlAddress addr = 3;
}

enum CloseReasonCode {
  CLOSE_REASON_CODE_UNSPECIFIED = 0;
  CLOSE_REASON_CODE_NORMAL      = 1;
  CLOSE_REASON_CODE_ERROR       = 2;
}

message SessionClosed {
  CloseReasonCode reason = 1;
  // Free-form detail (e.g. the Error string for CloseReason::Error).
  string detail = 2;
}

// ============================================================================
// Discovery (openspec: add-live-pipeline-observer)
// ============================================================================

message SessionSummaryPb {
  string session_id = 1;
  string pipeline_name = 2;
  uint64 created_at_ms = 3;
  // Transport kind ("grpc", "webrtc", "http", "ui", "ffi"); empty if unknown.
  string transport = 4;
  // "initializing" | "warm" | "active" | "closing".
  string phase = 5;
  uint32 node_count = 6;
  // Transport-specific origin (peer id, remote address); empty if unknown.
  string origin = 7;
  // Whether hot-path telemetry counters exist for this session.
  bool has_telemetry = 8;
  // A call reached an agent-hosted endpoint, or the session was marked
  // agent-backed (openspec: add-agent-harness-integration).
  bool agent_backed = 9;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionSummaryPb sessions = 1;
  uint32 observer_schema_version = 2;
  string server_version = 3;
}

message DescribeSessionRequest { string session_id = 1; }

message DescribeSessionResponse {
  // `SessionDescriptor` serialized as JSON (the Rust serde type is the
  // schema; see docs/OBSERVABILITY.md).
  string descriptor_json = 1;
  uint32 schema_version = 2;
}

message WatchSessionsRequest {}

message SessionClosedInfo {
  string session_id = 1;
  string reason = 2;
  uint64 ts_ms = 3;
}

message SessionLifecycle {
  oneof event {
    // First message on every WatchSessions stream.
    ListSessionsResponse initial = 1;
    SessionSummaryPb     created = 2;
    SessionSummaryPb     updated = 3;
    SessionClosedInfo    closed  = 4;
    // The watcher fell behind; clients should treat the next `initial`
    // as authoritative (the server re-sends one immediately).
    Empty                resync  = 5;
  }
}
