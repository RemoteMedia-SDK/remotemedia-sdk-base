[package]
name = "remotemedia-litert-nodes"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LiteRT nodes for RemoteMedia: Whisper speech-to-text, Gemma (LiteRT-LM) chat and Kokoro text-to-speech, the same models on Android and desktop"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk-base"
publish = false

# Its own workspace: a loadable plugin built per target (Android, Windows,
# Linux), not part of the sdk-base build.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "whisper-litert"
path = "src/bin/whisper_litert.rs"

[[bin]]
name = "kokoro-litert"
path = "src/bin/kokoro_litert.rs"
required-features = ["kokoro"]

[[bin]]
name = "gemma-litert"
path = "src/bin/gemma_litert.rs"

[features]
default = ["kokoro"]
# Kokoro text-to-speech: compiles LiteRT-LM's English phonemizer (C++) with
# Abseil, so the build needs CMake, Ninja and a C++ compiler.
kokoro = []

[dependencies]
# Same plugin SDK checkout as the host runner, so the plugin ABI matches.
remotemedia-plugin-sdk = { path = "../../../remotemedia-plugin-sdk/crates/plugin-sdk" }
abi_stable = "0.11"
async-trait = "0.1"
serde_json = "1"
# LiteRT is loaded at run time (liblitert_lm.so on Android, litert-lm.dll on
# Windows), so the plugin builds without it.
libloading = "0.8"
rustfft = "6"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
hound = "3.5"
memmap2 = "0.9"
regex = "1"
matrixmultiply = { version = "0.3", features = ["threading"] }

[build-dependencies]
cc = "1"
cmake = "0.1"

[profile.release]
debug = false
strip = true
