# LiteRT nodes as a Rust cdylib plugin.
#
# A directory holding this file and one build per platform, named by
# `asset_pattern`, works as a local plugin on every host:
#
#   litert-nodes/
#     plugin.toml
#     liblitert-nodes-aarch64-android.so    (cargo build --target aarch64-linux-android)
#     liblitert-nodes-x86_64-windows.dll
#     liblitert-nodes-x86_64-linux.so
#
#   "plugins": [{ "path": "./plugins/litert-nodes",
#                 "node_types": ["WhisperLiteRtNode", "GemmaAssistantNode", "KokoroTtsNode"] }]
#
# The runtimes are not bundled: each node loads its library when it starts
# (`runtime_lib`, or REMOTEMEDIA_LITERT_LIB / REMOTEMEDIA_LITERT_LM_LIB):
# LiteRT's libLiteRt.so on Android, LiteRT-LM's liblitert-lm.so (Android) or
# litert-lm.dll (Windows). See README.md.

[plugin]
name        = "litert-nodes"
version     = "0.1.0"
language    = "rust"
description = "Whisper speech-to-text, a Gemma voice assistant (LiteRT-LM) and Kokoro text-to-speech on LiteRT, the same models on Android and desktop"

[rust]
node_types    = ["WhisperLiteRtNode", "GemmaAssistantNode", "KokoroTtsNode"]
asset_pattern = "lib{name}-{arch}-{os}.{ext}"
