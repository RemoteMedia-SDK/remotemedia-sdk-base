[package]
name = "remotemedia-webrtc-server"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "WebRTC server binary for RemoteMedia real-time media streaming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[[bin]]
name = "webrtc-server"
path = "src/main.rs"

[dependencies]
# Transport library (with gRPC signaling for server mode)
remotemedia-webrtc = { path = "../../transports/webrtc", features = ["grpc-signaling"] }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Server utilities
num_cpus = { workspace = true }
