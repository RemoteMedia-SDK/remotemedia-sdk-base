[package]
name = "remotemedia-telephony-server"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "SIP/RTP telephony server binary for RemoteMedia pipeline execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[[bin]]
name = "telephony-server"
path = "src/main.rs"

[dependencies]
# RemoteMedia libraries
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../..", default-features = true }
remotemedia-telephony = { path = "../../transports/telephony" }

# Async runtime
tokio = { workspace = true }

# Logging & Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Server utilities
num_cpus = { workspace = true }
