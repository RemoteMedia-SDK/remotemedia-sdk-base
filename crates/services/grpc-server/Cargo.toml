[package]
name = "remotemedia-grpc-server"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "gRPC server binary for RemoteMedia pipeline execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[[bin]]
name = "grpc-server"
path = "src/main.rs"

[dependencies]
# Transport library
remotemedia-grpc = { path = "../../transports/grpc", default-features = true, features = ["multiprocess", "loadable", "bundled-uv-embedded"] }

# Bundle deployment service (install/activate .rmpkg artifacts)
remotemedia-bundle = { path = "../../bundle" }
remotemedia-bundle-deployment = { path = "../../bundle-deployment" }

# Force-link the inventory registrations for manifest-declared Python nodes
# such as WhisperSTTNode and LFM2DemoAgentNode. The generic server still only
# instantiates them when a submitted manifest requests them.
remotemedia-python-nodes = { path = "../../python-nodes" }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Server utilities
num_cpus = { workspace = true }
