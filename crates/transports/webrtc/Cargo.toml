[package]
name = "remotemedia-webrtc"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "WebRTC transport for RemoteMedia pipelines with multi-peer mesh networking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[lib]
name = "remotemedia_webrtc"
crate-type = ["rlib"]

[dependencies]
webrtc = "0.14.0"
tokio-tungstenite = "0.21"
opus = { git = "https://github.com/DCNick3/opus-rs.git", branch = "unsafe-libopus", default-features = false, features = ["unsafe-libopus-backend"] }
media-codec-vpx = { version = "0.5", optional = true }
openh264 = { version = "0.5", optional = true }
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true }
futures-util = "0.3"
prost = { workspace = true }
tonic = { workspace = true, features = ["transport"], optional = true }
tonic-web = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost-types = { workspace = true }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.5", features = ["fs", "set-header", "auth", "cors", "set-status", "trace"], optional = true }
http = { version = "1", features = ["std", "default"], optional = true }
http-body-util = { version = "0.1", features = ["default"], optional = true }
hyper = { version = "1", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["default"], optional = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = "0.22"
bytes = "1.5"
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
bollard = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../..", default-features = false, features = ["bundled-uv"] }
remotemedia-core-multiprocess = { package = "remotemedia-sdk-base", path = "../../..", default-features = false, features = ["multiprocess"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../..", default-features = false, features = ["bundled-uv"] }
remotemedia-core-multiprocess = { package = "remotemedia-sdk-base", path = "../../..", default-features = false, features = ["multiprocess"], optional = true }

[dev-dependencies]
remotemedia-traits = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk" }
tokio-test = "0.4"
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = "0.21"

[build-dependencies]
tonic-prost-build = { workspace = true }
protobuf-src = { workspace = true }

[features]
default = ["grpc-signaling"]
codecs = ["dep:media-codec-vpx"]
h264 = ["dep:openh264"]
# Video codec support (spec 012). Enables `remotemedia_core::nodes::video`
# (VideoEncoderNode / VideoDecoderNode), which the `video_integration_test`
# integration test depends on. Off by default because it pulls in ac-ffmpeg.
video = ["remotemedia-core/video"]
# Generic signaling feature for event bridge types (WebRtcEventBridge, etc.)
signaling = ["ws-signaling"]
ws-signaling = ["grpc-signaling"]
grpc-signaling = [
    "dep:tonic",
    "dep:tonic-web",
    "dep:tonic-prost",
    "dep:tokio-stream",
    "dep:tower",
    "dep:tower-http",
    "dep:http",
]
cli = ["dep:clap"]
avatar-core = [
    "remotemedia-core/avatar-emotion",
    "remotemedia-core/avatar-lipsync",
]
avatar-live2d = ["avatar-core"]
avatar-cc = ["avatar-core"]
avatar = ["avatar-core"]
full = ["codecs", "h264", "grpc-signaling", "ws-signaling"]
multiprocess = ["dep:remotemedia-core-multiprocess"]

[[test]]
name = "video_integration_test"
required-features = ["video"]
