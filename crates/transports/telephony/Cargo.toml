[package]
name = "remotemedia-telephony"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "SIP/RTP telephony transport for RemoteMedia pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[lib]
name = "remotemedia_telephony"
crate-type = ["rlib"]

[dependencies]
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../..", default-features = true }

async-trait = { workspace = true }
dashmap = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tracing = { workspace = true }
opus = { git = "https://github.com/DCNick3/opus-rs.git", branch = "unsafe-libopus", default-features = false, features = ["unsafe-libopus-backend"] }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = []
