[package]
name = "remotemedia-realtime"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
description = "Realtime WebSocket transport for RemoteMedia pipelines (AI SDK normalized realtime events)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[lib]
name = "remotemedia_realtime"
crate-type = ["rlib"]

[dependencies]
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../..", default-features = false, features = ["bundled-uv"] }
# The socket is served on the WebRTC signalling listener and shares its
# admission and its rooms.
remotemedia-webrtc = { path = "../webrtc", features = ["ws-signaling"] }

async-trait = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.21"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
remotemedia-types = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "e8fc165eea4064717b6fb23de5f1a18d925533d4" }
remotemedia-traits = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "e8fc165eea4064717b6fb23de5f1a18d925533d4" }
