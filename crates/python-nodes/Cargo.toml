[package]
name = "remotemedia-python-nodes"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"
description = "Python wrapper nodes for RemoteMedia pipelines"

[dependencies]
# Core dependency for traits
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../", default-features = false }
remotemedia-traits = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "44e02a9d24b1427cce48bc32ef837142787d0ba3" }
remotemedia-types = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "44e02a9d24b1427cce48bc32ef837142787d0ba3" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# Streaming
futures.workspace = true

# Auto-registration
inventory.workspace = true

[dev-dependencies]
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../", default-features = false, features = ["native-worker"] }
pyo3.workspace = true
remotemedia-shared-memory = { path = "../../../remotemedia-plugin-sdk/crates/shared-memory" }

[features]
default = ["multiprocess"]
# Python multiprocess execution with iceoryx2 IPC (not available on Android/Sproot)
multiprocess = ["remotemedia-core/multiprocess"]
# Feature flags for specific Python node families
whisper = []
tts = []
ml = []
test-nodes = []
# In-process Python execution via PyO3 (Android, or opt-in on Linux/macOS)
inprocess = ["remotemedia-core/inprocess-python"]
all = ["whisper", "tts", "ml", "test-nodes"]
