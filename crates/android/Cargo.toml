[package]
name = "remotemedia-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"
description = "Android SDK JNI library wrapper for pVM connection"

[lib]
name = "remotemedia_android"
crate-type = ["cdylib"]

[dependencies]
# SDK dependencies
remotemedia-core = { package = "remotemedia-sdk-base", path = "../../", default-features = false, features = ["loadable"] }
remotemedia-scaling-runner-protocol = { path = "../../../remotemedia-scaling/crates/runner_protocol" }
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"

# JNI support
jni = { version = "0.21", default-features = false }
android_logger = "0.15"
log = "0.4"

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tower = { workspace = true, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }

[features]
default = []
