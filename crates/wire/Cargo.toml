[package]
name = "remotemedia-wire"
description = "Lossless protobuf wire form of RemoteMedia frames (DataBuffer <-> RuntimeData)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
prost = { workspace = true }
remotemedia-types = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "b359edb0d9b55658817d19fd4dc2f8be2b56fd91" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
# Only for regenerating the committed bindings in src/generated/ (see build.rs).
tonic-prost-build = { workspace = true, optional = true }
protox = { workspace = true, optional = true }

[features]
default = []
# Regenerate (REMOTEMEDIA_REGEN_PROTOS=1) or check the committed protobuf
# bindings in src/generated/ against proto/common.proto.
regen-protos = ["dep:tonic-prost-build", "dep:protox"]
